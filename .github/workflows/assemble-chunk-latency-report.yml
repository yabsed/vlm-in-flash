name: Assemble cached latency report
on:
  push:
    branches: ['report/chunk-latency-8727979']
    paths:
      - 'conclusion/python/build_chunk_latency_report.py'
      - 'conclusion/python/test_chunk_latency_report.py'
      - '.github/workflows/assemble-chunk-latency-report.yml'
permissions:
  contents: write
jobs:
  assemble:
    if: github.repository == 'yabsed/vlm-in-flash'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          sparse-checkout: conclusion/python
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU analysis dependencies
        run: python -m pip install numpy pandas scipy matplotlib nbformat nbclient nbconvert ipykernel pytest tqdm
      - name: Prepare artifact directory
        run: echo "NOTEBOOK_ARTIFACT_DIR=$RUNNER_TEMP/chunk-latency-report" >> "$GITHUB_ENV"
      - name: Execute report from original cached CSVs
        run: python conclusion/python/build_chunk_latency_report.py
      - name: Verify computation, report outputs, and cache protection
        run: python -m pytest -q -s conclusion/python/test_chunk_latency.py conclusion/python/test_chunk_latency_report.py
      - name: Commit only report and derived model results to this review branch
        run: |
          git diff --exit-code -- conclusion/python/runs/02_chunk_latency/io_raw.csv conclusion/python/runs/02_chunk_latency/block_estimates.csv conclusion/python/runs/02_chunk_latency/hardware.json conclusion/python/runs/02_chunk_latency/latency_curve.csv conclusion/python/runs/02_chunk_latency/throughput_by_length.csv conclusion/python/runs/02_chunk_latency/breakpoint_comparison/latency_curve.csv conclusion/python/runs/02_chunk_latency/breakpoint_comparison/throughput_by_length.csv
          git add conclusion/python/02_chunk_latency.ipynb
          git add conclusion/python/runs/02_chunk_latency/breakpoint_comparison/*.csv conclusion/python/runs/02_chunk_latency/breakpoint_comparison/*.json conclusion/python/runs/02_chunk_latency/breakpoint_comparison/*.png conclusion/python/runs/02_chunk_latency/breakpoint_comparison/*.svg
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Embed the executed latency report and polished model figures'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polished-chunk-latency-report
          path: ${{ env.NOTEBOOK_ARTIFACT_DIR }}
          if-no-files-found: warn
          retention-days: 14
