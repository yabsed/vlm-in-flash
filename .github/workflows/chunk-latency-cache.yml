name: Cached chunk-latency notebook
on:
  pull_request:
    paths:
      - 'conclusion/python/02_chunk_latency.ipynb'
      - 'conclusion/python/chunk_latency.py'
      - 'conclusion/python/build_chunk_latency_report.py'
      - 'conclusion/python/test_chunk_latency*.py'
      - 'conclusion/python/runs/02_chunk_latency/**'
      - '.github/workflows/chunk-latency-cache.yml'
permissions:
  contents: read
jobs:
  cached-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: conclusion/python
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only analysis dependencies
        run: python -m pip install numpy pandas scipy matplotlib nbformat nbclient nbconvert ipykernel pytest tqdm
      - name: Test and execute the report against committed CSVs (no native reader)
        env:
          NOTEBOOK_ARTIFACT_DIR: ${{ runner.temp }}/chunk-latency-artifact
        run: |
          python -m pytest -q -s conclusion/python/test_chunk_latency.py conclusion/python/test_chunk_latency_report.py
          python -c 'import json, os, pathlib; p = pathlib.Path(os.environ["NOTEBOOK_ARTIFACT_DIR"]) / "breakpoint_comparison/findings.json"; f = json.loads(p.read_text()); print(json.dumps({"ts_free_breakpoint_kib": f["ts_free_breakpoint_kib"], "comparison": f["comparison"]}, indent=2))'
      - name: Publish executed notebook and comparison tables
        uses: actions/upload-artifact@v4
        with:
          name: chunk-latency-comparison
          path: ${{ runner.temp }}/chunk-latency-artifact
          if-no-files-found: error
          retention-days: 14
