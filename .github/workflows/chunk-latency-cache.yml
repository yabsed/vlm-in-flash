name: Native latency report
on:
  pull_request:
    paths:
      - 'conclusion/python/results/01/**'
      - 'preliminary_research/vlm-flash'
      - '.github/workflows/chunk-latency-cache.yml'
permissions:
  contents: read
jobs:
  notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pandas scipy matplotlib nbformat nbclient nbconvert ipykernel pytest
      - name: Check native delegation and render saved data only
        env:
          NOTEBOOK_ARTIFACT_DIR: ${{ runner.temp }}/native-latency-report
        run: |
          python -m pytest -q conclusion/python/results/01/test_chunk_latency.py
          git diff --exit-code -- conclusion/python/results/01/*.csv preliminary_research/vlm-flash
      - uses: actions/upload-artifact@v4
        with:
          name: native-latency-report
          path: ${{ runner.temp }}/native-latency-report
