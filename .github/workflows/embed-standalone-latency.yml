name: Embed standalone notebook outputs
on:
  push:
    branches: ['refactor/02-standalone-notebook']
    paths: ['.github/workflows/embed-standalone-latency.yml']
permissions:
  contents: write
jobs:
  embed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/02-standalone-notebook
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pandas scipy matplotlib nbformat nbclient nbconvert ipykernel
      - name: Execute saved-data report and commit its outputs
        run: |
          cd conclusion/python
          jupyter nbconvert --execute --to notebook --inplace 02_chunk_latency.ipynb
          git diff --exit-code -- runs/
          git add 02_chunk_latency.ipynb
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Embed executed standalone notebook figures and tables'
          git push origin HEAD:refactor/02-standalone-notebook
