name: Complete composed-cost report
on:
  push:
    branches: ['feat/selection-plus-modeled-io']
    paths: ['.github/workflows/finish-combined-cost.yml']
permissions:
  contents: write
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      MPLBACKEND: module://matplotlib_inline.backend_inline
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            conclusion/python/results/02/oracle_results_fixed_r.csv
            conclusion/python/results/03
            .github/workflows/finish-combined-cost.yml
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy pandas matplotlib nbformat nbclient nbconvert ipykernel
      - name: Append the section and replay saved data only
        run: |
          python - <<'PY'
          from pathlib import Path
          import copy, json, os
          import nbformat as nbf
          import numpy as np
          import pandas as pd
          from nbclient import NotebookClient
          from nbconvert import HTMLExporter

          path = Path('conclusion/python/results/03/03_selection_latency.ipynb').resolve()
          original = nbf.read(path, as_version=4)
          nb = copy.deepcopy(original)
          def cell(kind, identity, source):
              make = nbf.v4.new_code_cell if kind == 'code' else nbf.v4.new_markdown_cell
              return make(source.strip(), id=identity)
          new = [
          cell('markdown', 'combined-definition', r'''
          ## Add the modeled read cost, without another benchmark.

          Notebook 02 already records the fitted read cost of each mask. Join those rows to the measured selection times and add in milliseconds:

          $$\widehat C_{j,m}=\frac{\widehat t_{j,m}}{1000}+\widehat L(M_{j,m}).$$

          Tiles have a lower composed cost precisely when their selection saving exceeds any additional modeled read cost:

          $$\frac{\widehat t_{j,P}-\widehat t_{j,T}}{1000}>\widehat L(M_{j,T})-\widehat L(M_{j,P}).$$

          This reuses `selection_results.csv` and `../02/oracle_results_fixed_r.csv`; no selector or SSD measurement is repeated. The recorded CPU timings and Notebook 01's SSD model form a **composed estimate**, not a same-machine wall-time measurement. Compute, transfers, scheduling, and overlap are not measured by this sum.
          '''),
          cell('code', 'combined-cost', r'''
          if not frame.empty:
              keys = ["shape", "trace_id", "fraction", "R_nominal", "R_selected", "method"]
              io = pd.read_csv(QUALITY, usecols=keys + ["latency"]).rename(columns={"latency": "modeled_io_ms"})
              io["fraction"] = io.fraction.round(6)
              online = frame.assign(fraction=frame.fraction.round(6)).merge(io, on=keys, how="left", validate="one_to_one")
              assert online.modeled_io_ms.notna().all(), "02 must contain the same measured cases and selected counts."
              online["selection_ms"] = online.median_us / 1000
              online["combined_ms"] = online.selection_ms + online.modeled_io_ms
              for shape, data in online.groupby("shape"):
                  curves = data.groupby(["fraction", "method"]).combined_ms.median().unstack()
                  ax = curves.plot(marker="o", figsize=(7, 3.5), logy=True)
                  ax.set(title=shape, xlabel="Requested fraction R/N", ylabel="Selection + modeled I/O (ms; log scale)")
                  plt.tight_layout()
                  plt.show()
          '''),
          cell('markdown', 'combined-pairing', r'''
          The curves summarize all saved cases at each requested budget, including Paper underfill. They are not equal-importance comparisons. The table below instead uses only cases where Paper fills the requested $R$, paired across all methods. Equal counts match row volume, not necessarily importance or compute time. Each column is a median across those same cases; the combined column is the median of per-case sums, not the sum of the other two medians.
          '''),
          cell('code', 'combined-summary', r'''
          if not frame.empty:
              case = ["shape", "trace_id", "fraction", "R_nominal"]
              paper_rows = online[online.method == "Paper greedy"]
              filled = paper_rows[paper_rows.R_selected == paper_rows.R_nominal][case]
              exact = online.merge(filled, on=case, validate="many_to_one")
              if not exact.empty:
                  display(exact.groupby("method")[["selection_ms", "modeled_io_ms", "combined_ms"]].median().round(4))
                  paired = exact.pivot(index=case, columns="method", values="combined_ms")
                  ratio = paired["Paper greedy"] / paired["Saturation tiles"]
                  saving = paired["Paper greedy"] - paired["Saturation tiles"]
                  display(Markdown(
                      f"On **{len(paired):,}/{len(paper_rows):,}** exact-fill cases, tiles have a lower composed cost in "
                      f"**{int((saving > 0).sum()):,}/{len(paired):,}** pairs. The median paired Paper/Tiles ratio is "
                      f"**{ratio.median():.2f}×**, with a median paired saving of **{saving.median():.3f} ms**. "
                      "These are selection-plus-modeled-read estimates, not observed wall-time gains or equal-quality gains."))
              else:
                  display(Markdown("No Paper exact-fill cases are available for a paired cost comparison."))
              higher = paper_rows[paper_rows.fraction > 0.1]
              if not higher.empty:
                  display(Markdown(
                      f"Above the 10% requested budget, Paper's median fill is **{higher.fill_pct.median():.2f}%**; "
                      f"**{100 * higher.fill_pct.ge(95).mean():.2f}%** of cases fill at least 95%. "
                      "Near-full cases remain outside the exact-fill table; their trade-offs stay in the curves."))
          '''),
          ]
          assert not any(c.id.startswith('combined-') for c in nb.cells)
          index = next(i for i,c in enumerate(nb.cells) if c.id == 'scope')
          nb.cells[index:index] = new
          assert sum(len(c.source.splitlines()) for c in new if c.cell_type == 'code') == 37
          for c in nb.cells:
              if c.cell_type == 'code': compile(c.source,c.id,'exec')
          nbf.validate(nb)
          protected = [path.with_name('selection_results.csv'), path.with_name('environment.json'),
                       path.with_name('selectors.cpp'), path.parent.parent/'02/oracle_results_fixed_r.csv']
          before = {p:p.read_bytes() for p in protected}
          replay = copy.deepcopy(nb)
          replay.cells.insert(0,nbf.v4.new_code_cell('import sys\nsys.modules.update({n: None for n in ("torch", "vlmflash", "transformers")})',id='block-native'))
          NotebookClient(replay,timeout=90,kernel_name='python3',resources={'metadata':{'path':str(path.parent)}}).execute()
          checked = {c.id:c for c in replay.cells}
          number = max(c.get('execution_count') or 0 for c in nb.cells)
          for c in nb.cells:
              if c.id.startswith('combined-') and c.cell_type == 'code':
                  number += 1
                  c.execution_count = number
                  c.outputs = copy.deepcopy(checked[c.id].outputs)
                  for o in c.outputs:
                      if 'execution_count' in o: o.execution_count = number
          assert [c for c in nb.cells if not c.id.startswith('combined-')] == original.cells
          assert all(p.read_bytes()==b for p,b in before.items())
          assert sum('image/png' in o.get('data',{}) for c in new if c.cell_type=='code' for o in c.outputs)==4
          f = pd.read_csv(protected[0]); q = pd.read_csv(protected[3])
          keys = ['shape','trace_id','fraction','R_nominal','R_selected','method']
          x = f.sample(frac=1,random_state=0).merge(q[keys+['latency']],on=keys,validate='one_to_one')
          x['cost'] = x.median_us/1000+x.latency
          case = ['shape','trace_id','fraction','R_nominal']
          paper = x[x.method=='Paper greedy']
          exact = x.merge(paper[paper.R_selected==paper.R_nominal][case],on=case,validate='many_to_one')
          paired = exact.pivot(index=case,columns='method',values='cost')
          assert len(x)==3456 and len(paired)==480
          assert (paired['Paper greedy']>paired['Saturation tiles']).all()
          np.testing.assert_allclose((paired['Paper greedy']/paired['Saturation tiles']).median(),3.2788847674710295)
          for row in x.itertuples():
              np.testing.assert_allclose(row.cost,np.median(json.loads(row.samples_us))/1000+row.latency)
          bad = q.copy(); bad.loc[bad.method=='Paper greedy','R_selected'] += 1
          mismatch = f.merge(bad[keys+['latency']],on=keys,how='left',validate='one_to_one')
          assert mismatch.latency.isna().sum()==1152
          nbf.write(nb,path)
          out = Path(os.environ['RUNNER_TEMP'])/'combined-report'; out.mkdir()
          nbf.write(nb,out/path.name)
          html,_ = HTMLExporter().from_notebook_node(nb)
          (out/'report.html').write_text(html)
          print('Passed: saved-data replay, 4 new figures, 480 pairs, unchanged original cells and inputs, shuffled alignment, unit conversion, mismatched-count rejection.')
          PY
      - name: Publish only the completed notebook
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add conclusion/python/results/03/03_selection_latency.ipynb
          git rm .github/workflows/finish-combined-cost.yml
          git commit -m 'Complete selection plus modeled I/O analysis from saved CSVs'
          git push origin HEAD:feat/selection-plus-modeled-io
      - uses: actions/upload-artifact@v4
        with:
          name: completed-combined-cost-report
          path: ${{ runner.temp }}/combined-report
