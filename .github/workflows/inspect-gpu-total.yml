name: Publish GPU-sort and GEMM report
on:
  push:
    branches: ['feat/gpu-sort-composed-total']
    paths: ['.github/workflows/inspect-gpu-total.yml']
permissions:
  contents: write
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      MPLBACKEND: module://matplotlib_inline.backend_inline
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy pandas matplotlib nbformat nbclient nbconvert ipykernel
      - name: Apply notebook edits and replay only existing results
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, ast, os
          import nbformat as nbf
          from nbclient import NotebookClient
          from nbconvert import HTMLExporter
          base=Path('conclusion/python/results')
          inputs=[p for p in base.rglob('*') if p.is_file() and p.suffix in ('.csv','.npz','.json','.cpp')]
          before={p:p.read_bytes() for p in inputs}
          subprocess.run(['python','.github/gpu-total-edit.py'],check=True)
          path=base/'03/03_selection_latency.ipynb'
          nb=nbf.read(path,as_version=4)
          source='\n'.join(c.source for c in nb.cells if c.cell_type=='code')
          ast.parse(source)
          assert sum(len(c.source.splitlines()) for c in nb.cells if c.cell_type=='code') == 254
          guard=nbf.v4.new_code_cell("import sys\nsys.modules.update({n:None for n in ('torch','vlmflash','transformers')})",id='replay-only')
          nb.cells.insert(0,guard)
          NotebookClient(nb,timeout=120,kernel_name='python3',resources={'metadata':{'path':str(path.parent.resolve())}}).execute()
          nb.cells.pop(0)
          nbf.write(nb,path)
          assert all(p.read_bytes()==old for p,old in before.items())
          out=Path(os.environ['RUNNER_TEMP'])/'gpu-total-report'
          out.mkdir()
          nbf.write(nb,out/path.name)
          html,_=HTMLExporter().from_notebook_node(nb)
          (out/'report.html').write_text(html)
          print('254 Python lines; saved-data replay passed; original input bytes unchanged; no GPU execution claimed.')
          PY
      - name: Commit only the report and remove temporary tooling
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/gpu-total-edit.py .github/workflows/inspect-gpu-total.yml
          git add conclusion/python/results/03/03_selection_latency.ipynb
          git commit -m 'Add explicit CPU and CUDA-sort variants with composed packed-GEMM estimates'
          git push origin HEAD:feat/gpu-sort-composed-total
      - uses: actions/upload-artifact@v4
        with:
          name: gpu-total-report
          path: ${{ runner.temp }}/gpu-total-report
