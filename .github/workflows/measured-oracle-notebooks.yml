name: Measured oracle notebooks
on:
  pull_request:
    paths:
      - 'conclusion/python/results/01/**'
      - 'conclusion/python/results/02/**'
      - 'conclusion/upstream/vlm-flash'
      - '.github/scripts/check_global_oracle.py'
      - '.github/workflows/measured-oracle-notebooks.yml'
permissions:
  contents: read
jobs:
  notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      MPLBACKEND: module://matplotlib_inline.backend_inline
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy pandas scipy matplotlib nbformat nbclient nbconvert ipykernel
      - name: Check the oracle against exhaustive enumeration
        run: python .github/scripts/check_global_oracle.py
      - name: Check nominal budgets, upstream underfill and CSV-only replay
        run: |
          python - <<'PY'
          import json, os, shutil, tempfile
          from pathlib import Path
          import numpy as np
          import pandas as pd
          import nbformat as nbf
          from nbclient import NotebookClient
          from nbclient.exceptions import CellExecutionError
          from nbconvert import HTMLExporter
          from traitlets.config import Config

          repo = Path.cwd()
          out = Path(os.environ['RUNNER_TEMP']) / 'measured-oracle'
          out.mkdir(parents=True, exist_ok=True)
          original = repo / 'conclusion/python/results/01/block_estimates.csv'
          before = original.read_bytes()
          export = Config({'TagRemovePreprocessor': {'remove_input_tags': ['hide-input']},
                           'HTMLExporter': {'exclude_input_prompt': True, 'exclude_output_prompt': True}})

          def execute(path, overrides='', blocked=('torch', 'profile_flash', 'vlmflash', 'transformers'), fixture=False):
              nb = nbf.read(path, as_version=4)
              sources = {c.id: c.source for c in nb.cells}
              source = '\n'.join(c.source for c in nb.cells if c.cell_type == 'code')
              if path.name == '02_global_oracle.ipynb':
                  assert all(x not in source for x in ('RUN_SCALING', 'sha256(', 'fingerprint', 'atomic_json', 'def paper('))
                  assert sum(len(c.source.splitlines()) for c in nb.cells if c.cell_type == 'code') <= 385
                  assert 'vlmflash.select_chunks(' in source
                  solver = next(c.source for c in nb.cells if c.id == 'global-dp-12')
                  assert 'initial' not in solver and 'paper' not in solver.lower()
              guard = nbf.v4.new_code_cell(f'import sys\nsys.modules.update({{n: None for n in {blocked!r}}})')
              nb.cells.insert(0, guard)
              setup = next(i for i,c in enumerate(nb.cells) if c.id == 'setup')
              control = nbf.v4.new_code_cell(overrides)
              nb.cells.insert(setup+1, control)
              if fixture:
                  next(c for c in nb.cells if c.id == 'global-dp-17').source += '\nPAPER_GEOMETRY.update({"64x128": (8,8), "17x4096": (8,8), "8x4096": (8,8)})'
              nbf.validate(nb)
              NotebookClient(nb, timeout=120, kernel_name='python3', resources={'metadata': {'path': str(path.parent)}}).execute()
              nb.cells = [c for c in nb.cells if c.id not in (guard.id, control.id)]
              for cell in nb.cells:
                  cell.source = sources[cell.id]
              return nb

          with tempfile.TemporaryDirectory() as tmp:
              work = Path(tmp)
              for rel in ('conclusion/python/results/01/01_chunk_latency.ipynb',
                          'conclusion/python/results/01/block_estimates.csv',
                          'conclusion/python/results/02/oracle_results_fixed_r.csv',
                          'conclusion/python/results/02/02_analyze_oracle.ipynb',
                          'conclusion/python/results/02/02_global_oracle.ipynb'):
                  dest = work / rel
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(repo / rel, dest)
              shutil.copytree(repo/'conclusion/upstream/vlm-flash/src', work/'conclusion/upstream/vlm-flash/src')
              p1 = work/'conclusion/python/results/01/01_chunk_latency.ipynb'
              p2 = work/'conclusion/python/results/02/02_global_oracle.ipynb'
              analysis = p2.with_name('02_analyze_oracle.ipynb')
              n1 = execute(p1)
              # The report runs with only its CSV, without NPZ, model JSON or upstream code.
              report_dir = work/'csv-report'
              report_dir.mkdir()
              report_path = report_dir/analysis.name
              shutil.copy2(analysis, report_path)
              report_csv = report_dir/'oracle_results_fixed_r.csv'
              shutil.copy2(p2.with_name(report_csv.name), report_csv)
              report_before = report_csv.read_bytes()
              n2 = execute(report_path)
              assert report_csv.read_bytes() == report_before
              for nb,path in ((n1,p1),(n2,report_path)):
                  nbf.write(nb, out/path.name)
                  html,_ = HTMLExporter(config=export).from_notebook_node(nb)
                  (out/path.with_suffix('.html').name).write_text(html,encoding='utf-8')

              # Explicitly synthetic projections exercise the actual pinned Torch selector.
              arrays, entries = {}, []
              for i,(n,d) in enumerate(((64,128),(17,4096),(8,4096))):
                  key = f'v{i}'
                  arrays[key] = np.zeros(n,dtype=np.float32) if i==2 else np.random.default_rng(i).uniform(0,4,n).astype(np.float32)
                  entries.append(dict(trace_id=i,input_index=i,shape=f'{n}x{d}',n=n,d=d,array=key))
              # Paper can beat the exact-R ratio by reading only the valuable 32-row block.
              arrays['v0'] = np.r_[np.full(32,4.),np.zeros(32)].astype(np.float32)
              manifest = dict(model_dtype='bfloat16',traces=entries)
              archive = p2.with_name('fixture.npz')
              np.savez_compressed(archive, manifest_json=np.asarray(json.dumps(manifest)), **arrays)
              overrides = 'TRACE = Path("fixture.npz")\nRESULTS = Path("fixture.csv")\nPAPER_IMPL = "torch"\nMAX_TRACES_PER_SHAPE = 0\nBUDGETS = np.array([.1,.5,.7,.8,.9])'
              execute(p2, overrides, blocked=('transformers','profile_flash'), fixture=True)
              csv = p2.with_name('fixture.csv')
              saved = csv.read_bytes()
              result = pd.read_csv(csv)
              assert {'ok','empty_selection','zero_importance'} == set(result.status)
              assert len(result)==60
              assert (result.groupby(['trace_id','fraction']).method.nunique()==4).all()
              paper = result[result.method=='Paper greedy']
              exact = result[result.method!='Paper greedy']
              assert (exact.R_selected==exact.R_nominal).all()
              assert (paper.R_selected<=paper.R_nominal).all()
              assert (paper.R_selected==0).any() and (paper.R_selected<paper.R_nominal).any()
              assert (paper.R_selected==paper.R_nominal).any()
              expected = np.maximum(1,(result.fraction*result.N).astype(int))
              np.testing.assert_array_equal(result.R_nominal,expected)
              eligible = (result.R_selected==result.R_nominal) & (result.status=='ok')
              assert result.loc[~eligible,['gap_lower_pct','gap_upper_pct']].isna().all().all()
              assert result.loc[eligible,['gap_lower_pct','gap_upper_pct']].notna().all().all()
              assert (result.loc[eligible].gap_upper_pct-result.loc[eligible].gap_lower_pct).max() < .000101
              model = json.loads(p1.with_name('latency_model.json').read_text())
              for row in result.itertuples():
                  spans = np.asarray(json.loads(row.intervals),dtype=int).reshape(-1,2)
                  lengths = np.diff(spans,axis=1).ravel()
                  assert lengths.sum()==row.R_selected and len(lengths)==row.chunks
                  w = 2*entries[row.trace_id]['d']/1024
                  shortage = np.maximum(model['s_kib']/w-lengths,0).sum()
                  np.testing.assert_allclose(row.fill_pct,100*row.R_selected/row.R_nominal)
                  np.testing.assert_allclose(row.shortfall_rows,shortage)
                  np.testing.assert_allclose(row.overhead_ms,w*model['delta_ms_per_kib']*shortage,atol=1e-10)
                  np.testing.assert_allclose(row.latency-w*(model['c1_ms_per_kib']+model['delta_ms_per_kib'])*row.R_selected,row.overhead_ms,atol=1e-10)
              reversal = result[(result.trace_id==0) & np.isclose(result.fraction,.9)].set_index('method')
              assert reversal.loc['Paper greedy','R_selected'] < reversal.loc['Global DP','R_selected']
              ratios = reversal.importance/reversal.latency
              assert ratios['Paper greedy'] > ratios['Global DP']
              assert pd.isna(reversal.loc['Paper greedy','gap_upper_pct'])

              # No legacy matched-R dataset can silently become a nominal-R report.
              result.rename(columns={'R_selected':'R'}).to_csv(p2.with_name('legacy.csv'),index=False)
              try:
                  execute(analysis, 'RESULTS = Path("legacy.csv")')
              except CellExecutionError as e:
                  assert 'R_selected' in str(e)
              else:
                  raise AssertionError('Accepted a legacy matched-cardinality CSV')
              archive.unlink()
              replay = execute(analysis, 'RESULTS = Path("fixture.csv")')
              assert csv.read_bytes()==saved
              outputs = [o for c in replay.cells if c.cell_type=='code' for o in c.outputs]
              assert sum('image/png' in o.get('data',{}) for o in outputs)==4
              assert original.read_bytes()==before
              # No synthetic comparison is published as empirical Qwen evidence.
          print('Nominal-R oracle; actual upstream underfill including ratio reversal; four fixture figures from CSV alone; saved experiment replayed.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: measured-oracle-reports
          path: ${{ runner.temp }}/measured-oracle
