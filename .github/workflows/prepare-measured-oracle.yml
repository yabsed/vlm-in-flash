name: Prepare measured oracle reports
on:
  push:
    branches: ['feat/measured-global-oracle']
    paths: ['.github/workflows/prepare-measured-oracle.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: '1'
      MPLBACKEND: module://matplotlib_inline.backend_inline
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/measured-global-oracle
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pandas scipy matplotlib nbformat nbclient nbconvert ipykernel pyyaml lxml
      - name: Assemble source without native measurement
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import nbformat as nbf
          instructions = subprocess.check_output(['git','ls-files','*AGENTS.md'],text=True).strip()
          if instructions:
              raise RuntimeError('Review repository instructions before assembly: '+instructions)
          p = Path('.github/prepare_measured_oracle.py')
          s = p.read_text()
          a = s.index("code('numerical-models', r'''")
          b = s.index("if False else '''",a)+len('if False else ')
          s = s[:a]+"code('numerical-models', "+s[b:]
          compile(s,str(p),'exec')
          p.write_text(s)
          exec(compile(s,str(p),'exec'),{'__name__':'__main__'})
          p2 = Path('conclusion/python/results/02/02_global_oracle.ipynb')
          nb = nbf.read(p2,as_version=4)
          cells = {c.id:c for c in nb.cells}
          cells['setup'].source += '\nassert len(set(BUDGETS)) == len(BUDGETS) and all(0 < f < 1 for f in BUDGETS)'
          cells['baseline-definition'].source += '\n\nExplicit native execution requires PyTorch and the submodule\'s C++/Ninja build dependencies. Initialize it from the repository root with `git submodule update --init -- conclusion/upstream/vlm-flash`. Cached evaluation needs no native build.'
          cells['runtime-plan'].source = cells['runtime-plan'].source.replace('plan.round(3)', 'display(plan.round(3))\ndisplay(Markdown(f"Projected oracle-only work on the old host constant: **{plan.projected_oracle_minutes.sum():.1f} minutes**. This is not a new timing measurement."))')
          cells['case-cache'].source = cells['case-cache'].source.replace('int(round(100*fraction))', 'BUDGETS.index(fraction)')
          cells['scaling'].metadata.setdefault('tags',[]).append('recipe')
          for c in nb.cells:
              if c.cell_type=='code': compile(c.source,c.id,'exec')
          nbf.write(nb,p2)
          def entry(path):
              return subprocess.check_output(['git','ls-files','--stage','--',path],text=True).split()
          old,new = entry('preliminary_research/vlm-flash'),entry('conclusion/upstream/vlm-flash')
          if old:
              assert old[0] == new[0] == '160000' and old[1] == new[1]
              assert 'path = preliminary_research/vlm-flash' not in Path('.gitmodules').read_text()
              subprocess.run(['git','update-index','--force-remove','preliminary_research/vlm-flash'],check=True)
          PY
      - name: Run the permanent notebook-only checks
        run: |
          python - <<'PY'
          import subprocess, yaml
          from pathlib import Path
          workflow = yaml.safe_load(Path('.github/workflows/measured-oracle-notebooks.yml').read_text())
          step = next(s for s in workflow['jobs']['notebooks']['steps']
                      if s.get('name') == 'Execute linked reports and tiny identities only')
          subprocess.run(['bash','-e','-c',step['run']],check=True)
          PY
      - name: Validate only the upstream CPU selector and cache on a nine-row fixture
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          git submodule update --init --depth 1 -- conclusion/upstream/vlm-flash
          python - <<'PY'
          import ast, json, sys, platform, tempfile, copy
          from pathlib import Path
          from time import perf_counter
          from tempfile import NamedTemporaryFile
          import numpy as np
          import pandas as pd
          import scipy
          from scipy.ndimage import maximum_filter1d
          import nbformat as nbf
          p = Path('conclusion/python/results/02/02_global_oracle.ipynb')
          cells = {c.id:c.source for c in nbf.read(p,as_version=4).cells}
          ns = dict(np=np,pd=pd,scipy=scipy,maximum_filter1d=maximum_filter1d,Path=Path,
              json=json,sys=sys,platform=platform,NamedTemporaryFile=NamedTemporaryFile,perf_counter=perf_counter,
              UPSTREAM=Path('conclusion/upstream/vlm-flash').resolve(),
              UPSTREAM_SHA='9023679ebfd1900fa2912c4098f51bfb9efa7bb8',PAPER_IMPL='torch',traces=[],
              s_kib=5.,c1=.01,delta=.005,s99=10.,z_grid=np.arange(1,17,dtype=float),
              weight_bytes=2,RTOL=1e-6,MAX_TABLE_MIB=128,run_id='nine-row-verification-only')
          ns['T_holdout'] = ns['c1']*ns['z_grid'] + ns['delta']*np.maximum(ns['s_kib'],ns['z_grid'])
          for id in ('costs','bellman','global-dp-09','ratio-solve','tiles','upstream-selector','evaluate-mask'):
              exec(cells[id],ns)
          normalization = [n for n in ast.parse(cells['trace-input']).body if isinstance(n,ast.FunctionDef) and n.name=='importance_vector']
          exec(compile(ast.Module(body=normalization,type_ignores=[]),'notebook-normalization','exec'),ns)
          fixture = dict(trace_id=0,shape='9x896',n=9,d=896,module='verification',prompt_sha256='verification',
                         values=np.array([1,4,2,8,3,9,2,6,1],dtype=np.float32))
          ns['PAPER_GEOMETRY']['9x896'] = (4.,4.)
          backend = ns['load_upstream']()
          payload = dict(ns['one_case'](fixture,.5,backend),fingerprint=ns['run_id'])
          assert payload['status']=='ok' and len(payload['records'])==4
          defs = [n for n in ast.parse(cells['case-cache']).body if isinstance(n,ast.FunctionDef) and n.name in ('atomic_json','check_payload')]
          exec(compile(ast.Module(body=defs,type_ignores=[]),'cache-functions','exec'),ns)
          ns['check_payload'](payload,fixture,.5)
          with tempfile.TemporaryDirectory() as directory:
              path = Path(directory)/'fixture.json'
              ns['atomic_json'](path,payload)
              before = path.read_bytes()
              ns['check_payload'](json.loads(path.read_text()),fixture,.5)
              assert path.read_bytes()==before
              broken = copy.deepcopy(payload)
              broken['fingerprint']='wrong'
              try: ns['check_payload'](broken,fixture,.5)
              except AssertionError: pass
              else: raise AssertionError('Mismatched cache identity accepted')
          assert ns['one_case'](fixture,1/9,backend)['status']=='empty_selection'
          v = ns['importance_vector'](fixture)
          q = 1.75
          T = ns['costs'](9,5/q,q*.01,q*.015)
          mask = np.ones(9,dtype=bool)
          ns['z_grid'] = np.arange(1,5,dtype=float)
          ns['T_holdout'] = ns['T_holdout'][:4]
          result = ns['evaluate_mask'](fixture,v,mask,T)
          assert not result['lookup_supported'] and result['lookup_ms'] is None
          print('Nine-row upstream torch selection, realized budgets, saved-mask identities, cache round trip and unsupported-lookup rejection passed; no archived trace experiment or SSD I/O.')
          PY
      - name: Embed results and remove one-time assembly files
        run: |
          cp "$RUNNER_TEMP/measured-oracle/01_chunk_latency.ipynb" conclusion/python/results/01/
          cp "$RUNNER_TEMP/measured-oracle/latency_model.json" conclusion/python/results/01/
          cp "$RUNNER_TEMP/measured-oracle/02_global_oracle.ipynb" conclusion/python/results/02/
          git diff --exit-code -- ':(glob)**/*.csv' ':(glob)**/*.npz' conclusion/upstream/vlm-flash
          git add conclusion/python/results/01/01_chunk_latency.ipynb conclusion/python/results/01/latency_model.json conclusion/python/results/02/02_global_oracle.ipynb conclusion/python/results/02/.gitignore
          git rm -f .github/prepare_measured_oracle.py .github/workflows/prepare-measured-oracle.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Embed fitted equations and a validated, unrun real-trace oracle protocol'
          git push origin HEAD:feat/measured-global-oracle
      - uses: actions/upload-artifact@v4
        with:
          name: measured-oracle-reports
          path: ${{ runner.temp }}/measured-oracle
