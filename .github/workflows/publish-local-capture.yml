name: Publish local capture notebook
on:
  push:
    branches: ['fix/oracle-local-traces-paper-seed']
    paths: ['.github/workflows/publish-local-capture.yml']
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OPENBLAS_NUM_THREADS: '1'
      MPLBACKEND: module://matplotlib_inline.backend_inline
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pandas scipy matplotlib nbformat nbclient nbconvert ipykernel pyyaml
      - name: Apply and validate only the prepared notebook changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml, subprocess
          source = yaml.safe_load(Path('.github/workflows/prepare-local-capture.yml').read_text())
          steps = source['jobs']['edit']['steps']
          wanted = ('Apply the two changes without running a model or benchmark',
                    'Execute existing notebook CI with all expensive switches disabled',
                    'Check Paper bounds and seed reuse without full experiments')
          for name in wanted:
              step=next(s for s in steps if s.get('name')==name)
              subprocess.run(['bash','-e','-c',step['run']],check=True)
          PY
      - name: Commit the notebook only
        run: |
          git restore -- .github/workflows/measured-oracle-notebooks.yml
          git diff --exit-code -- conclusion/python/results/01 conclusion/upstream/vlm-flash ':(glob)**/*.csv' ':(glob)**/*.npz'
          git add conclusion/python/results/02/02_global_oracle.ipynb
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Capture local activation traces in notebook 02 and seed the oracle with Paper'
          git push origin HEAD:fix/oracle-local-traces-paper-seed
      - uses: actions/upload-artifact@v4
        with:
          name: local-capture-paper-seed-report
          path: ${{ runner.temp }}/measured-oracle
