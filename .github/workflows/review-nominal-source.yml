name: Review concurrent notebook source
on:
  push:
    branches: ['fix/nominal-r-oracle']
    paths: ['.github/workflows/review-nominal-source.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare source, not saved outputs
        run: |
          python - <<'PY'
          import subprocess, json, difflib
          from pathlib import Path
          path = 'conclusion/python/results/02/02_global_oracle.ipynb'
          old = json.loads(subprocess.check_output(['git','show','8c2467f3cc9527fcce5473be211b6373ada831c2:'+path]))
          new = json.loads(subprocess.check_output(['git','show','b0446eda754f73e347ead515ceffbda28db5c713:'+path]))
          def source(nb):
              return {c['id']: ''.join(c['source']) for c in nb['cells']}
          a,b = source(old),source(new)
          for key in a.keys() | b.keys():
              if a.get(key) != b.get(key):
                  print('CHANGED SOURCE:',key)
                  print(''.join(difflib.unified_diff(a.get(key,'').splitlines(True),b.get(key,'').splitlines(True))))
          out = Path('source-review')
          out.mkdir()
          (out/'concurrent.ipynb').write_text(json.dumps(new))
          (out/'proposed.ipynb').write_bytes(Path(path).read_bytes())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: notebook-source-review
          path: source-review
