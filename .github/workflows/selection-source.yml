name: Selection source snapshot
on:
  push:
    branches: ['feat/native-selection-benchmark']
    paths: ['.github/workflows/selection-source.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bundle the existing report inputs and reference implementation
        run: |
          git submodule update --init conclusion/upstream/vlm-flash
          mkdir -p /tmp/selection-source/conclusion/python
          cp -a conclusion/python/results /tmp/selection-source/conclusion/python/
          cp -a conclusion/upstream /tmp/selection-source/conclusion/
          cp .gitmodules /tmp/selection-source/
          git rev-parse HEAD > /tmp/selection-source/SOURCE_COMMIT
          find /tmp/selection-source -name .git -type f -delete
          tar -czf /tmp/selection-source.tar.gz -C /tmp/selection-source .
      - uses: actions/upload-artifact@v4
        with:
          name: native-selection-source
          path: /tmp/selection-source.tar.gz
          retention-days: 2
